<script>
const D=JSON.parse(document.getElementById('d').textContent);
const DAYS=Object.keys(D.days).sort();
const COMM=4;
function isowk(dt){const t=new Date(dt+'T12:00:00Z');const d=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()));const dn=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-dn+3);const th=new Date(Date.UTC(d.getUTCFullYear(),0,4));const dn2=(th.getUTCDay()+6)%7;th.setUTCDate(th.getUTCDate()-dn2+3);return d.getUTCFullYear()+'-W'+String(1+Math.round((d-th)/6048e5)).padStart(2,'0')}
function simulate(startB,riskPct,useD2B,useAl){
 let bal=startB,lo=bal,pk=bal,mdd=0;const wk={},mo={},dayPnl={};
 for(const dt of DAYS){
  let p=0;
  for(const n of['DAMN2B','ALEPH']){
   if(n==='DAMN2B'&&!useD2B)continue;if(n==='ALEPH'&&!useAl)continue;
   const sl=D.sl[n],rm=sl*0.5,q=Math.max(1,Math.floor(bal*(riskPct/100)/rm)),R=rm*q;
   const rs=D.days[dt][n];const ct=4/sl+COMM/(sl*5);
   p+=(rs.reduce((a,b)=>a+b,0)-ct*rs.length)*R;
  }
  bal+=p;lo=Math.min(lo,bal);pk=Math.max(pk,bal);mdd=Math.max(mdd,pk-bal);
  dayPnl[dt]=p;const w=isowk(dt);wk[w]=(wk[w]||0)+p;mo[dt.slice(0,7)]=(mo[dt.slice(0,7)]||0)+p;
 }
 return{bal,lo,mdd,wk,mo,dayPnl,final:bal};
}
function chart(id,vals,isBar,startB){
 const cv=document.getElementById(id),ctx=cv.getContext('2d');
 const W=cv.width=cv.offsetWidth*2,H=cv.height=cv.offsetHeight*2;ctx.clearRect(0,0,W,H);
 const mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max.apply(null,vals),pad=12;
 const y=v=>H-pad-(v-mn)/(mx-mn)*(H-2*pad),xw=W/vals.length;
 ctx.strokeStyle='#30363d';ctx.beginPath();ctx.moveTo(0,y(0));ctx.lineTo(W,y(0));ctx.stroke();
 if(isBar){vals.forEach((v,i)=>{ctx.fillStyle=v>=0?'#3fb950':'#f85149';ctx.fillRect(i*xw,y(Math.max(0,v)),Math.max(1,xw*0.8),Math.abs(y(v)-y(0)));});}
 else{ctx.strokeStyle='#58a6ff';ctx.lineWidth=2.5;ctx.beginPath();vals.forEach((v,i)=>{const px=i*xw;i?ctx.lineTo(px,y(v)):ctx.moveTo(px,y(v))});ctx.stroke();
  ctx.strokeStyle='#f85149';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(0,y(startB));ctx.lineTo(W,y(startB));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#f85149';ctx.font='18px monospace';ctx.fillText('start',10,y(startB)-8);}
}
function run(){
 const start=parseFloat(document.getElementById('start').value)||10000;
 const risk=parseFloat(document.getElementById('risk').value)||2;
 const r=simulate(start,risk,document.getElementById('d2b').checked,document.getElementById('al').checked);
 const wkK=Object.keys(r.wk).sort(),moK=Object.keys(r.mo).sort(),dK=Object.keys(r.dayPnl).sort();
 const wkV=wkK.map(k=>r.wk[k]),moV=moK.map(k=>r.mo[k]),dV=dK.map(k=>r.dayPnl[k]);
 const cum=[];let c=start;wkV.forEach(v=>{c+=v;cum.push(c)});
 const nD=dV.filter(x=>x<0).length,nW=wkV.filter(x=>x<0).length,nM=moV.filter(x=>x<0).length;
 const redD=dK.filter(k=>r.dayPnl[k]<0).map(k=>k+' '+Math.round(r.dayPnl[k]).toLocaleString());
 const redW=wkK.filter(k=>r.wk[k]<0).map(k=>k+' '+Math.round(r.wk[k]).toLocaleString());
 const redM=moK.filter(k=>r.mo[k]<0).map(k=>k+' '+Math.round(r.mo[k]).toLocaleString());
 const stats=[['Final','$'+Math.round(r.bal).toLocaleString()],['Return',((r.bal/start-1)*100).toFixed(0)+'%'],
  ['Min balance','$'+Math.round(r.lo).toLocaleString()],['Max DD','$'+Math.round(r.mdd).toLocaleString()],
  ['Red days',nD+'/'+dV.length],['Red weeks',nW+'/'+wkV.length],['Red months',nM+'/'+moV.length]];
 document.getElementById('stats').innerHTML=stats.map(s=>'<div class="card"><div class="v">'+s[1]+'</div><div class="l">'+s[0]+'</div></div>').join('');
 chart('eq',cum,false,start);chart('wk',wkV,true,start);
 document.getElementById('mtbl').innerHTML='<tr><th>Month</th><th>P&amp;L</th></tr>'+moK.map(k=>'<tr><td>'+k+'</td><td class="'+(r.mo[k]<0?'neg':'pos')+'">'+(r.mo[k]>=0?'+':'')+Math.round(r.mo[k]).toLocaleString()+'</td></tr>').join('');
}
document.getElementById('go').onclick=run;run();
</script></body></html>
